<!DOCTYPE html>
<html lang="en" data-default-theme="conservative">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume - [Your Name]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Conservative Theme - Ink on Paper */
      --ink: #0a0a0b;
      --ink-rgb: 10, 10, 11;
      --paper: #f1efea;
      --paper-rgb: 241, 239, 234;
      --accent: #0a0a0b; /* Same as ink for conservative */
      --accent-rgb: 10, 10, 11;

      /* Typography */
      --font-serif-en: 'Source Serif 4', Georgia, serif;
      --font-serif-zh: 'Noto Serif SC', serif;
      --font-body: var(--font-serif-en);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Slide/Page Layout */
    .slide {
      width: 100vw;
      height: 100vh;
      padding: 6vh 6vw;
      overflow: hidden;
      position: relative;
      page-break-after: always;
      print-break-after: always;
    }

    /* Typography */
    .name {
      font-family: var(--font-serif-en);
      font-size: 4.6vw;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 0.5em;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 1.5em;
      opacity: 0.8;
    }

    .section-title {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1.5em;
      padding-bottom: 0.5em;
      border-bottom: 2px solid var(--ink);
    }

    /* Header */
    .resume-header .contact-info {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      font-size: 0.9rem;
      opacity: 0.75;
      margin-top: 1em;
    }

    .contact-item {
      font-family: 'IBM Plex Mono', monospace;
    }

    .separator {
      opacity: 0.4;
    }

    /* Summary */
    .summary-content p {
      font-size: 1.1rem;
      line-height: 1.7;
      text-align: justify;
      max-width: 800px;
    }

    /* Skills */
    .skills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8em 1.2em;
    }

    .skill-tag {
      display: inline-block;
      padding: 0.3em 0.8em;
      border: 1px solid var(--ink);
      border-radius: 2px;
      font-size: 0.9rem;
    }

    /* Experience */
    .experience-entry {
      margin-bottom: 2em;
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.3em;
    }

    .company {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .position {
      font-size: 1rem;
      font-weight: 500;
      font-style: italic;
      margin-bottom: 0.8em;
      opacity: 0.9;
    }

    .bullets {
      list-style: none;
      padding-left: 0;
    }

    .bullets li {
      position: relative;
      padding-left: 1.5em;
      margin-bottom: 0.6em;
      font-size: 0.95rem;
    }

    .bullets li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--ink);
      font-weight: bold;
    }

    /* Dual Experience */
    .dual-experience {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2em;
    }

    /* Education */
    .education-entry {
      margin-bottom: 1.5em;
    }

    .edu-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.2em;
    }

    .institution {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .degree {
      font-size: 1rem;
      font-style: italic;
      margin-bottom: 0.3em;
    }

    .gpa {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* Projects */
    .project-entry {
      margin-bottom: 1.8em;
    }

    .project-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.3em;
    }

    .tech-stack {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      opacity: 0.7;
      margin-bottom: 0.5em;
    }

    /* Certifications */
    .cert-list {
      list-style: none;
    }

    .cert-list li {
      margin-bottom: 0.8em;
      font-size: 1rem;
    }

    .cert-issuer {
      display: block;
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 0.2em;
    }

    .cert-date {
      float: right;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* Languages */
    .language-list {
      display: flex;
      flex-direction: column;
      gap: 1em;
    }

    .language-item {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      align-items: center;
      gap: 1em;
    }

    .lang-name {
      font-weight: 500;
    }

    .proficiency-bar {
      height: 8px;
      background: rgba(10, 10, 11, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--ink);
    }

    .proficiency-level {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* Volunteer */
    .volunteer-entry {
      margin-bottom: 1.5em;
    }

    .organization {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .role {
      font-size: 1rem;
      font-style: italic;
      margin-bottom: 0.5em;
      opacity: 0.9;
    }

    /* Publications */
    .publication-entry {
      margin-bottom: 1.2em;
    }

    .pub-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.2em;
    }

    .pub-venue {
      font-style: italic;
      opacity: 0.9;
    }

    .pub-date {
      float: right;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* Closing */
    .closing-content {
      text-align: center;
      padding-top: 20vh;
    }

    .closing-content h2 {
      font-size: 2.5rem;
      margin-bottom: 1em;
    }

    .references-list {
      margin-top: 2em;
      text-align: left;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* === Phase 1 新版式样式 (R13-R18) === */

    /* R13: Cover */
    .cover-container {
      text-align: center;
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .cover-name {
      font-size: 5rem;
      margin-bottom: 0.5em;
    }
    .cover-title {
      font-size: 1.5rem;
      opacity: 0.8;
      margin-bottom: 0.5em;
    }
    .cover-tagline {
      font-size: 1.2rem;
      opacity: 0.7;
      max-width: 600px;
      margin-bottom: 1.5em;
    }
    .cover-contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1em;
      font-size: 1rem;
      opacity: 0.75;
    }

    /* R14: Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2em;
      margin-top: 1em;
    }
    .stat-item {
      text-align: center;
      padding: 1.5em;
      border: 1px solid var(--ink);
      border-radius: 4px;
    }
    .stat-value {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 0.3em;
      color: var(--accent);
    }
    .stat-label {
      font-size: 1rem;
      opacity: 0.8;
    }

    /* R15: Project Cards */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5em;
      margin-top: 0.8em;
    }
    .project-card {
      padding: 1.2em;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 6px;
    }
    .card-title {
      font-size: 1.1rem;
      margin-bottom: 0.3em;
      color: var(--accent);
    }
    .card-tech {
      font-size: 0.85rem;
      opacity: 0.75;
      margin-bottom: 0.4em;
      font-family: 'IBM Plex Mono', monospace;
    }
    .card-desc {
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* R16: Skills Tags */
    .skills-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8em 1em;
      margin-top: 0.6em;
    }
    .skill-tag {
      display: inline-block;
      padding: 0.4em 0.9em;
      border: 1px solid var(--ink);
      border-radius: 2px;
      font-size: 0.9rem;
    }

    /* R17: Timeline */
    .timeline {
      position: relative;
      margin-top: 1em;
      padding-left: 2em;
      border-left: 2px solid var(--accent);
    }
    .timeline-item {
      position: relative;
      margin-bottom: 2em;
      padding-left: 1em;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -2.6em;
      top: 0.3em;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid white;
      box-shadow: 0 0 0 2px var(--accent);
    }
    .timeline-year {
      font-size: 0.85rem;
      opacity: 0.7;
      font-family: 'IBM Plex Mono', monospace;
      margin-bottom: 0.2em;
    }
    .timeline-content {
      margin-left: 0.5em;
    }
    .timeline-role {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
    }
    .timeline-company {
      font-size: 0.95rem;
      opacity: 0.85;
    }

    /* R18: Contact */
    .contact-container {
      text-align: center;
      padding-top: 10vh;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3em;
      margin-top: 2em;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }
    .contact-item-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .qr-placeholder {
      width: 150px;
      height: 150px;
      border: 2px dashed var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
      font-size: 0.9rem;
    }
    .qr-label {
      margin-top: 0.8em;
      font-size: 0.85rem;
      opacity: 0.75;
    }
    .qr-image {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }
    .contact-info-block {
      padding-top: 1em;
    }
    .info-name {
      font-size: 1.8rem;
      margin-bottom: 0.3em;
    }
    .info-title {
      font-size: 1.1rem;
      opacity: 0.85;
      margin-bottom: 1em;
    }
    .info-list p {
      margin-bottom: 0.6em;
      font-size: 0.95rem;
    }

    /* Print Styles */
    @media print {
      .slide {
        page-break-after: always;
        height: auto;
        min-height: 100vh;
      }
      @page {
        size: A4;
        margin: 0;
      }
      body {
        background: white;
        color: black;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <!-- Slides will be injected here by the skill -->
  <div id="deck"></div>

  <script src="templates.js"></script>
  <script src="themes.js"></script>
  <script>
    console.log('Conservative Template loaded. Theme auto-applied by themes.js.');
  </script>
</body>
</html>
